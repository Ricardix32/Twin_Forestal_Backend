version: '3.8'

services:
  silvatwin-postgis:
    image: postgis/postgis:16-3.4
    container_name: silvatwin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: silvatwin
      POSTGRES_USER: silvatwin_user
      POSTGRES_PASSWORD: silvatwin_secret
    ports:
      - "5432:5432"
    volumes:
      - silvatwin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silvatwin_user -d silvatwin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  silvatwin_pgdata:
    driver: local
